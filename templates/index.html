<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        .form-group label {
            font-weight: 600;
            color: #264653;
            margin-bottom: 8px;
            display: block;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            color: #333;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2a9d8f;
        }
        .btn-submit {
            background-color: #2a9d8f;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #218579;
        }
        .result-box {
            background-color: #e9f7f6;
            border: 1px solid #2a9d8f;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
        .result-box.error {
            background-color: #ffe0e0;
            border-color: #e76f51;
            color: #e76f51;
        }
        .result-box p {
            font-size: 1.1rem;
            color: #264653;
            margin-bottom: 10px;
        }
        .result-box .prediction {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2a9d8f;
            margin-bottom: 5px;
        }
        .result-box .confidence {
            font-size: 1.2rem;
            color: #f4a261;
        }
        .result-box.error .prediction {
            color: #e76f51;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Personality Predictor</h1>
        
        <form action="/predict" method="post" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="form-group">
                    <label for="time_spent_alone">Time spent alone (hours):</label>
                    <input type="number" step="0.1" id="time_spent_alone" name="time_spent_alone" required
                           value="{{ input_data['Time spent alone'] if input_data else '' }}">
                </div>
                <div class="form-group">
                    <label for="social_event_attendance">Social event attendance (per month):</label>
                    <input type="number" step="1" id="social_event_attendance" name="social_event_attendance" required
                           value="{{ input_data['Social event attendance'] if input_data else '' }}">
                </div>
                <div class="form-group">
                    <label for="going_outside">Going outside (times per week):</label>
                    <input type="number" step="1" id="going_outside" name="going_outside" required
                           value="{{ input_data['Going outside'] if input_data else '' }}">
                </div>
                <div class="form-group">
                    <label for="friends_circle_size">Friends circle size:</label>
                    <input type="number" step="1" id="friends_circle_size" name="friends_circle_size" required
                           value="{{ input_data['Friends circle size'] if input_data else '' }}">
                </div>
                <div class="form-group">
                    <label for="post_frequency">Post frequency (posts per week):</label>
                    <input type="number" step="1" id="post_frequency" name="post_frequency" required
                           value="{{ input_data['Post frequency'] if input_data else '' }}">
                </div>
                <div class="form-group">
                    <label for="stage_fear">Stage fear:</label>
                    <select id="stage_fear" name="stage_fear" required>
                        <option value="">Select...</option>
                        <option value="Yes" {% if input_data and input_data['Stage fear'] == 'Yes' %}selected{% endif %}>Yes</option>
                        <option value="No" {% if input_data and input_data['Stage fear'] == 'No' %}selected{% endif %}>No</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="drained_after_socializing">Drained after socializing:</label>
                    <select id="drained_after_socializing" name="drained_after_socializing" required>
                        <option value="">Select...</option>
                        <option value="Yes" {% if input_data and input_data['Drained after socializing'] == 'Yes' %}selected{% endif %}>Yes</option>
                        <option value="No" {% if input_data and input_data['Drained after socializing'] == 'No' %}selected{% endif %}>No</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-submit">Predict Personality</button>
        </form>

        {% if prediction_result %}
            <div class="result-box {% if is_error %}error{% endif %}">
                {% if is_error %}
                    <p class="prediction">Error!</p>
                    <p class="text-red-600">{{ prediction_result }}</p>
                {% else %}
                    <p>Predicted Personality:</p>
                    <p class="prediction">{{ prediction_result }}</p>
                    <p class="confidence">Confidence: {{ "%.2f" | format(confidence * 100) }}%</p>
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
